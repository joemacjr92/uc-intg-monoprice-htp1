name: Publish BEQ catalogue

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: beq-catalogue-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch upstream catalogue
        run: |
          curl --fail --location --retry 3 \
            https://beqcatalogue.readthedocs.io/en/latest/database.json \
            --output /tmp/beq-database.json

      - name: Fetch upstream license notices
        run: |
          curl --fail --location https://raw.githubusercontent.com/3ll3d00d/beqcatalogue/master/LICENSE --output /tmp/beqcatalogue-LICENSE
          curl --fail --location https://raw.githubusercontent.com/3ll3d00d/beqfilters/main/LICENSE --output /tmp/beqfilters-LICENSE

      - name: Build compact catalogue
        run: |
          python tools/build_beq_catalogue.py \
            --source /tmp/beq-database.json \
            --output public/beq
          cp /tmp/beqcatalogue-LICENSE public/beq/BEQCATALOGUE-LICENSE
          cp /tmp/beqfilters-LICENSE public/beq/BEQFILTERS-LICENSE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
