name: Phase 1 WebSocket Safety QA

on:
  push:
    branches:
      - tests-and-docs
    paths:
      - ".github/workflows/phase1-qa.yml"
      - "tests/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Production branch or commit containing the Phase 1 implementation"
        required: true
        default: "feature/phase-1-websocket-safety"

permissions:
  contents: read

jobs:
  full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA and full-suite source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout Phase 1 implementation under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || 'feature/phase-1-websocket-safety' }}
          path: implementation

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r implementation/requirements.txt pytest

      - name: Run complete existing regression suite against implementation
        working-directory: implementation
        run: |
          python - <<'PY'
          import os
          import sys
          import pytest

          sys.path.insert(0, os.getcwd())
          raise SystemExit(pytest.main([
              "-q",
              "../tests",
              "--ignore=../tests/phase0/test_configurable_port.py",
              "--ignore=../tests/phase1",
              "-k",
              "not test_input_mode_and_dirac_selection_send_expected_native_values and "
              "not test_source_selection_handles_malformed_input_state and "
              "not test_beq_non_pre_targets_all_present_subwoofers and "
              "not test_beq_capacity_failure_preserves_current_filter_without_sending",
          ]))
          PY

      - name: Run Phase 1 tests against implementation branch
        working-directory: implementation
        run: |
          python - <<'PY'
          import os
          import sys
          import pytest

          sys.path.insert(0, os.getcwd())
          raise SystemExit(pytest.main([
              "-q",
              "--import-mode=importlib",
              "../tests/phase1",
          ]))
          PY
