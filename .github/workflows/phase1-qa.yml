name: Phase 1 WebSocket Safety QA

on:
  push:
    branches:
      - tests-and-docs
    paths:
      - ".github/workflows/phase1-qa.yml"
      - "tests/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Production branch or commit containing the Phase 1 implementation"
        required: true
        default: "feature-validation"

permissions:
  contents: read

jobs:
  full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA and full-suite source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout Phase 1 implementation under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || 'feature-validation' }}
          path: implementation

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r implementation/requirements.txt pytest pytest-cov

      - name: Run Ruff lint checks
        run: |
          python -m pip install ruff
          ruff check --select F implementation/intg_monoprice_htp1 tests tools

      - name: Run complete existing regression suite against implementation
        working-directory: implementation
        run: |
          python - <<'PY'
          import os
          import sys
          import pytest

          sys.path.insert(0, os.getcwd())
          raise SystemExit(pytest.main([
              "-q",
              "../tests",
              "--ignore=../tests/phase0/test_configurable_port.py",
              "--ignore=../tests/phase1",
          ]))
          PY

      - name: Run Phase 0 compatibility tests against implementation branch
        working-directory: implementation
        run: |
          python - <<'PY'
          import os
          import sys
          import pytest

          sys.path.insert(0, os.getcwd())
          raise SystemExit(pytest.main(["-q", "../tests/phase0"]))
          PY

      - name: Run newly added regression-gap tests against implementation branch
        working-directory: implementation
        run: |
          python - <<'PY'
          import os
          import sys
          import pytest

          sys.path.insert(0, os.getcwd())
          raise SystemExit(pytest.main([
              "-q",
              "--import-mode=importlib",
              "../tests/phase1/test_power_toggle_regressions.py",
              "../tests/phase1/test_http_ir_commands.py",
              "../tests/phase1/test_remote_command_sequences.py",
              "../tests/phase1/test_websocket_probe.py",
          ]))
          PY

      - name: Run Phase 1 tests against implementation branch
        working-directory: implementation
        run: |
          python - <<'PY'
          import os
          import sys
          import pytest

          sys.path.insert(0, os.getcwd())
          raise SystemExit(pytest.main([
              "-q",
              "--import-mode=importlib",
              "../tests/phase1",
              "--cov=intg_monoprice_htp1.device",
              "--cov=intg_monoprice_htp1.browser",
              "--cov-report=term-missing",
              "--cov-report=xml:coverage.xml",
          ]))
          PY

      - name: Run verified TLS regression tests against implementation branch
        working-directory: implementation
        run: python -m pytest -q ../tests/test_browser_tls.py
