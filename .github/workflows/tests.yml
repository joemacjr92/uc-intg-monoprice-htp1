name: Tests

on:
  push:
    branches:
      - tests-and-docs
  pull_request:
    branches:
      - main
      - tests-and-docs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA tests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout production implementation under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feature-validation
          path: implementation

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r implementation/requirements.txt pytest

      - name: Run standard regression suite against production implementation
        working-directory: implementation
        run: |
          python - <<'PY'
          import os
          import sys
          import pytest

          sys.path.insert(0, os.getcwd())
          raise SystemExit(pytest.main([
              "-q",
              "../tests",
              "--ignore=../tests/phase0/test_configurable_port.py",
              "--ignore=../tests/phase1",
              "--ignore=../tests/test_browser_tls.py",
              "--ignore=../tests/test_configurable_port.py",
          ]))
          PY
