name: Phase 0 and Full QA Tests

on:
  push:
    branches:
      - tests-and-docs
    paths:
      - ".github/workflows/phase0-qa.yml"
      - "tests/**"
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Production branch or commit containing the Phase 0 implementation"
        required: true
        default: "feature/configurable-htp1-port"

permissions:
  contents: read

jobs:
  full-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA and full-suite source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout Phase 0 implementation under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref || 'feature/configurable-htp1-port' }}
          path: implementation

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -r implementation/requirements.txt pytest

      # Run the branch's complete existing suite against its matching source.
      # Phase 0's tests are run separately against the Phase 0 implementation
      # checkout so they cannot accidentally import the wrong source tree.
      - name: Run complete existing regression suite
        run: python -m pytest -q --ignore=tests/phase0/test_configurable_port.py --ignore=tests/phase1

      - name: Run Phase 0 regression tests against implementation branch
        working-directory: implementation
        env:
          PYTHONPATH: .
        run: python -m pytest -q ../tests/phase0/test_configurable_port.py
