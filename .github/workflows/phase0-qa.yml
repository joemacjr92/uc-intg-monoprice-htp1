name: Phase 0 QA Tests

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Production branch or commit containing the Phase 0 implementation"
        required: true
        default: "feature/configurable-htp1-port"

permissions:
  contents: read

jobs:
  phase0-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout QA and test material
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout implementation under test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.source_ref }}
          path: implementation

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install implementation dependencies and pytest
        run: python -m pip install -r implementation/requirements.txt pytest

      - name: Run Phase 0 regression tests
        env:
          PYTHONPATH: implementation
        run: python -m pytest -q tests/phase0/test_configurable_port.py
