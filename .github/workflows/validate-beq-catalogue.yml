name: Validate published BEQ catalogue compatibility

on:
  push:
    branches:
      - tests-and-docs
    paths:
      - ".github/workflows/validate-beq-catalogue.yml"
      - "intg_monoprice_htp1/browser.py"
      - "tests/test_live_beq_catalogue.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: beq-published-catalogue-compatibility
  cancel-in-progress: true

jobs:
  live-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install integration dependencies and pytest
        run: python -m pip install -r requirements.txt pytest
      - name: Check Mase's published GitHub Pages catalogue
        env:
          HTP1_LIVE_BEQ_CATALOGUE: "1"
        run: python -m pytest -q tests/test_live_beq_catalogue.py
